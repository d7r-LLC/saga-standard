# SAGA Smart Contract Deployment Configuration
# See: docs/superpowers/specs/2026-03-26-secure-deploy-design.md
version: 1

defaults:
  contracts:
    - SAGAHandleRegistry
    - SAGAAgentIdentity
    - SAGAOrgIdentity
    - SAGATBAHelper
  verify: true
  notify: true

chains:
  base-sepolia:
    chainId: 84532
    rpc: https://sepolia.base.org
    safe: '0x3F31e7FE81F4f859FB630E1c97FB693f23a3f3B8'
    safeThreshold: 1
    explorerApi: https://api-sepolia.basescan.org
    safeTransactionService: https://safe-transaction-base-sepolia.safe.global
    external:
      erc6551Registry: '0x000000006551c19487814612e58FE06813775758'
      # Canonical Tokenbound V3 (chain-pinned in Deploy.s.sol via Phase 9 G-6 / Phase 11 J-9)
      tbaImplementation: '0x55266d75D1a14E4572138116aF39863Ed6596E7F'
    op:
      vault: saga-prod
      signerItem: base-signer
      # Signer credential lives in a custom CONCEALED field
      # (`private_key`) on base-signer, not the standard /password
      # field. The deploy entrypoint's signerField support reads from
      # any configurable field name; the credential format detector
      # (word-count) handles either a hex private key or a BIP-39
      # mnemonic transparently.
      signerField: private_key
      addressesItem: base-sepolia-addresses
      explorerKeyItem: basescan-api-key

  base:
    chainId: 8453
    rpc: https://mainnet.base.org
    safe: '0x3F31e7FE81F4f859FB630E1c97FB693f23a3f3B8'
    safeThreshold: 3
    explorerApi: https://api.basescan.org
    safeTransactionService: https://safe-transaction-base.safe.global
    production: true
    external:
      erc6551Registry: '0x000000006551c19487814612e58FE06813775758'
      # Canonical Tokenbound V3 (chain-pinned in Deploy.s.sol via Phase 9 G-6 / Phase 11 J-9)
      tbaImplementation: '0x55266d75D1a14E4572138116aF39863Ed6596E7F'
    op:
      vault: saga-prod
      signerItem: base-mainnet-signer
      addressesItem: base-mainnet-addresses
      explorerKeyItem: basescan-api-key

networkAllowlist:
  - my.1password.com
